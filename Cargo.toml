[package]
name = "klixx"
version = "0.1.0"
edition = "2021"
description = "A Rust/Macroquad point-and-click game starter."
authors = ["zinnusl"]
license = "Proprietary"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
